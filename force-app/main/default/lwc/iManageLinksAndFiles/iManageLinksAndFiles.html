<template>
  <lightning-card title={cardTitle}>
    <div class="container">
      <template if:true={showSpinner}>
        <lightning-spinner
          alternative-text="Loading"
          size="medium"
        ></lightning-spinner>
      </template>
      <template if:true={showIManageDocsIframe}>
        <c-i-manage-documents-i-frame> </c-i-manage-documents-i-frame>
      </template>

      <lightning-tabset>
        <template if:true={isDocumentsTabVisible}>
          <lightning-tab label="Documents" onactive={handleDocumentsTabActive}>
            <div class="paging paging-top">
              <span>Total records: {docsRecordsCount}</span>
              <!-- <lightning-button-icon icon-name="utility:chevronleft"  alternative-text="Previous" title="Previous" onclick={loadPreviousPage}></lightning-button-icon> -->
              <template if:true={docsNextButtonVisible}>
                <lightning-button-icon
                  icon-name="utility:chevronright"
                  alternative-text="Next"
                  title="Next"
                  onclick={docsLoadNextPage}
                  disabled={docsNextButtonDisabled}
                ></lightning-button-icon>
              </template>
              <div class="buttons">
                <template if:true={allowSaveIManageDocAsCopy}>
                  <lightning-button
                    label="New Document from iManage"
                    onclick={loadNewDocumentFromIManage}
                    disabled={disableNewFileFromImanageButton}
                  ></lightning-button>
                </template>
                <template if:true={allowSaveIManageDocAsLink}>
                  <lightning-button
                    label="New Link from iManage"
                    onclick={loadNewLinkFromIManage}
                    disabled={loading}
                  ></lightning-button>
                </template>
              
              <template if:false={simplifiedMode}>
                <lightning-button-icon
                  icon-name="utility:settings"
                  alternative-text="Settings"
                  title="Settings"
                  onclick={showModalBox}
                >
                </lightning-button-icon>
              </template>
            </div>
            </div>
            <div class="grid">
              <c-i-manage-links-and-files-datatable
                key-field="id"
                class="imanage-links-and-docs-dt"
                data={docsGridData}
                hide-checkbox-column
                show-row-number-column
                columns={docsGridColumns}
                onrowaction={onDocsRowClick}
                sorted-by={docsSortField}
                sorted-direction={docsSortDirection}
                onsort={onDocsSort}
              >
              </c-i-manage-links-and-files-datatable>
              <template if:true={isDocsGridDataEmpty}>
                <div class="empty-grid">No data to display</div>
              </template>
            </div>
            <div class="paging paging-bottom">
              <template if:true={docsNextButtonVisible}>
                <lightning-button-icon
                  icon-name="utility:chevronright"
                  alternative-text="Next"
                  title="Next"
                  onclick={docsLoadNextPage}
                  disabled={docsNextButtonDisabled}
                ></lightning-button-icon>
              </template>
            </div>
          </lightning-tab>
        </template>
        <template if:true={isFolderTabVisible}>
          <lightning-tab label="Folders" onactive={handleFoldersTabActive}>
            <div class="buttons">
              <template if:true={allowSaveIManageFolderAsLink}>
                <lightning-button
                  label="Link Folder from iManage"
                  onclick={loadNewFolderLinkFromIManage}
                  disabled={loading}
                ></lightning-button>
              </template>
            </div>
            <div class="paging paging-top">
              <!-- <lightning-button-icon icon-name="utility:chevronleft"  alternative-text="Previous" title="Previous" onclick={loadPreviousPage}></lightning-button-icon> -->
              <template if:true={foldersNextButtonVisible}>
                <lightning-button-icon
                  icon-name="utility:chevronright"
                  alternative-text="Next"
                  title="Next"
                  onclick={foldersLoadNextPage}
                  disabled={foldersNextButtonDisabled}
                ></lightning-button-icon>
              </template>
              <span>Total records: {foldersRecordsCount}</span>
            </div>
            <div class="grid">
              <c-i-manage-links-and-files-datatable
                key-field="id"
                class="imanage-links-and-docs-dt"
                data={foldersGridData}
                hide-checkbox-column
                show-row-number-column
                columns={foldersGridColumns}
                onrowaction={onFoldersRowClick}
              >
              </c-i-manage-links-and-files-datatable>
              <template if:true={isFoldersGridDataEmpty}>
                <div class="empty-grid">No data to display</div>
              </template>
            </div>
            <div class="paging paging-bottom">
              <template if:true={foldersNextButtonVisible}>
                <lightning-button-icon
                  icon-name="utility:chevronright"
                  alternative-text="Next"
                  title="Next"
                  onclick={foldersLoadNextPage}
                  disabled={foldersNextButtonDisabled}
                ></lightning-button-icon>
              </template>
            </div>
        </lightning-tab>
        </template>
      </lightning-tabset>
    </div>
  </lightning-card>

  <!-- modal start -->
  <template if:true={isShowModal}>
    <section
      role="dialog"
      tabindex="-1"
      aria-labelledby="modal-heading-01"
      aria-modal="true"
      aria-describedby="modal-content-id-1"
      class="slds-modal slds-fade-in-open"
    >
      <div class="slds-modal__container">
        <!-- modal header start -->
        <header class="slds-modal__header">
          <button
            class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
            title="Close"
            onclick={hideModalBox}
          >
            <lightning-icon
              icon-name="utility:close"
              alternative-text="close"
              variant="inverse"
              size="small"
            ></lightning-icon>
            <span class="slds-assistive-text">Close</span>
          </button>
          <h2
            id="modal-heading-01"
            class="slds-text-heading_medium slds-hyphenate"
          >
            Manage columns
          </h2>
        </header>

        <!-- modal body start -->
        <div
          class="slds-modal__content slds-p-around_medium"
          id="modal-content-id-1"
        >
          <lightning-checkbox-group
            name="Manage columns"
            label="Manage columns"
            options={docsListColumns}
            value={docsViewColumns}
            onchange={handleManageColumnChange}
          ></lightning-checkbox-group>
        </div>

        <!-- modal footer start-->
        <footer class="slds-modal__footer">
          <button
            class="slds-button slds-button_neutral"
            onclick={hideModalBox}
          >
            Done
          </button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>
  <!-- modal end -->
</template>
