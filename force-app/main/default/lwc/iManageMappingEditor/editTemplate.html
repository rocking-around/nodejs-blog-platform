<template>
  <template if:true={loading}>
    <div class="spinnerContainer">
      <lightning-spinner
        alternative-text="Loading"
        size="medium"
      ></lightning-spinner>
    </div>
  </template>
  <template if:false={loading}>
    <lightning-card title="iManage Mapping">
      <!-- <div>
                <input id="matterId" list="matterIdOptions" class="slds-input matter-id-input" type="text" onchange={onMatterIdObjectChanged} />
                <datalist id="matterIdOptions" class="matter-id-options">
                    <template for:each={matterIdOptions} for:item='opt'>
                        <option key={opt.key} value={opt.key}>{opt.value}</option>
                    </template>
                </datalist>
            </div> -->
      <div class="imanage-mapping-container">
        <lightning-combobox
          name="client-id-object"
          label="Salesforce Client Id Object"
          value={editEntityClientIdObjectField}
          placeholder="Select"
          options={clientIdObjectOptions}
          onchange={onClientIdObjectChanged}
          dropdown-alignment="auto"
          required
        ></lightning-combobox>

        <lightning-combobox
          name="client-id-object-field"
          label="Salesforce Client Id Field"
          value={editClientIdField}
          placeholder="Select"
          options={clientIdObjectFieldOptions}
          onchange={onClientIdObjectFieldChanged}
          dropdown-alignment="auto"
          required
        ></lightning-combobox>

        <lightning-combobox
          name="client-name-object-field"
          label="Salesforce Client Name Field"
          value={editClientNameField}
          placeholder="Select"
          options={clientNameObjectFieldOptions}
          onchange={onClientNameObjectFieldChanged}
          dropdown-alignment="auto"
          required
        ></lightning-combobox>

        <lightning-combobox
          name="matter-id-object"
          label="Salesforce Matter Id Object"
          value={editEntityMatterIdObjectField}
          placeholder="Select"
          options={matterIdObjectOptions}
          onchange={onMatterIdObjectChanged}
          dropdown-alignment="auto"
          required
        ></lightning-combobox>

        <lightning-combobox
          name="matter-id-object-field"
          label="Salesforce Matter Id Field"
          value={editMatterIdField}
          placeholder="Select"
          options={matterIdObjectFieldOptions}
          onchange={onMatterIdObjectFieldChanged}
          dropdown-alignment="auto"
          required
        ></lightning-combobox>

        <lightning-combobox
          name="matter-name-object-field"
          label="Salesforce Matter Name Field"
          value={editMatterNameField}
          placeholder="Select"
          options={matterNameObjectFieldOptions}
          onchange={onMatterNameObjectFieldChanged}
          dropdown-alignment="auto"
          required
        ></lightning-combobox>
      </div>
      <div slot="actions">
        <template if:true={changed}>
          <lightning-button
            label="Save"
            onclick={save}
            disabled={isSaving}
            class="imanage-save-button"
          ></lightning-button>
          <lightning-button label="Cancel" onclick={cancel}> </lightning-button>
        </template>
        <template if:false={changed}>
          <lightning-button label="View" onclick={cancel}> </lightning-button>
        </template>
      </div>
    </lightning-card>
  </template>
</template>
