<template>
  <lightning-modal-header label={title}></lightning-modal-header>
  <lightning-modal-body>
    <div class="container">
      <template if:true={saving}>
        <lightning-spinner
          alternative-text="Saving"
          size="medium"
        ></lightning-spinner>
      </template>
      <iframe
        width="100%"
        height="560px"
        allow="local-network-access"
        src={url}
        frameborder="0"
        referrerpolicy="no-referrer"
        sandbox="allow-same-origin allow-scripts allow-forms allow-top-navigation-to-custom-protocols allow-top-navigation-by-user-activation allow-top-navigation allow-popups allow-downloads"
      ></iframe>
    </div>
  </lightning-modal-body>
</template>
