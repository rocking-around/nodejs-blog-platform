<template>
  <!-- {label.messageEmptyClientOrMatter} -->
  <template if:true={loading}>
    <div class="spinnerContainer">
      <lightning-spinner
        alternative-text="Loading"
        size="medium"
      ></lightning-spinner>
    </div>
  </template>
  <template if:true={errorMessage}>
    <p class="error">{errorMessage}</p>
  </template>
  <template if:true={showIFrame}>

    <iframe
      src={iManageUrl}
      height={height}
      width={width}
      allow="local-network-access"
      referrerpolicy={referrerPolicy}
      sandbox={sandbox}
      title={title}
    ></iframe>
    <template  if:true={notFound}>
      <div class="notFound">
      You may not have rights to see this Workspace, or the Workspace does not exist.
      </div>
    </template>
    <div class="slds-m-around_medium slds-text-align_right">
      <template  if:true={found}>
        <lightning-button
        class="form-button"
        label="Open in new tab"
        onclick={handleOpenNewTabClick}
        variant="brand"
      ></lightning-button>
      </template>
      <lightning-button
        class="form-button"
        label="Refresh"
        onclick={handleRefreshClick}
        variant="brand"
      ></lightning-button>
    </div>
  </template>
</template>
