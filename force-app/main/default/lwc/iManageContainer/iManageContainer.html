<template>
  <template if:true={loading}>
    <div class="spinnerContainer">
      <lightning-spinner
        alternative-text="Loading"
        size="medium"
      ></lightning-spinner>
    </div>
  </template>
  <template if:true={error}>
    <p class="error">{error}</p>
  </template>
  <template if:true={showIFrame}>
    <iframe
      src={iManageUrl}
      height={height}
      width={width}
      referrerpolicy={referrerPolicy}
      sandbox={sandbox}
      title={title}
    ></iframe>
  </template>
</template>
