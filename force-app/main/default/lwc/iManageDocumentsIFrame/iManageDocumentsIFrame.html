<template>
  <lightning-modal-header label={title}></lightning-modal-header>
  <lightning-modal-body>
    <div class="container">
      <template if:true={saving}>
        <lightning-spinner
          alternative-text="Saving"
          size="medium"
        ></lightning-spinner>
      </template>
      <iframe width="100%" height="560px" src={url} frameborder="0"></iframe>
    </div>
  </lightning-modal-body>
  <!-- <lightning-modal-footer>
        <lightning-button label="OK" onclick={handleOkay}></lightning-button>
    </lightning-modal-footer> -->
</template>
