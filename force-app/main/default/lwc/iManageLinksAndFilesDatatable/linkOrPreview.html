<template>
  <template if:true={typeAttributes.preview}>
    <c-file-preview
      record-id={typeAttributes.id}
      label={typeAttributes.label}
    ></c-file-preview>
  </template>
  <template if:false={typeAttributes.preview}>
    <lightning-formatted-url
      value={value}
      label={typeAttributes.label}
      target="_blank"
    ></lightning-formatted-url>
  </template>
</template>
